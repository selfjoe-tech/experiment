name: Check feed redesign (verified)

on:
  push:
    branches:
      - feature/instagram-style-feed-shell
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://tkplsmxyouexyirhkqlf.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CI_PLACEHOLDER
      NEXT_PUBLIC_SITE_URL: https://goongram.com
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check new feed and shell TypeScript diagnostics
        run: |
          npx tsc --noEmit > ts-diagnostics.txt 2>&1 || true
          echo "Total existing TypeScript errors:"
          grep -c "error TS" ts-diagnostics.txt || true
          echo "New feature diagnostics:"
          grep -E '^(app/components/feed/(PostCard|HomeTimeline|layout/(AppNavigation|DesktopShell|MobileChrome|WatchDesktopShell|WatchMobileChrome))\.tsx|app/(page\.tsx|reels/|post/|saved/)|lib/actions/(homeFeed|bookmarks)\.ts)' ts-diagnostics.txt && exit 1 || true
          echo "SEO route and utility diagnostics:"
          grep -E '^(lib/seo/|app/components/seo/PublicMediaDirectory|app/videos/|app/images/|app/indexnow/|app/api/seo/|app/sitemap|app/image/|app/creators/|app/watch/\[id\]/page\.tsx|app/\[username\]/page\.tsx|app/robots\.tsx|app/components/age/AdultAgeGate\.tsx|app/explore/\[tab\]/layout\.tsx|app/explore/\[tab\]/\[tag\]/page\.tsx)' ts-diagnostics.txt && exit 1 || true
          echo "Reels initialization-order diagnostics:"
          if grep -E '^app/components/feed/(VideoCard|VideoFeed)\.tsx.*error TS(2448|2454)' ts-diagnostics.txt; then
            exit 1
          fi
      - name: Check social, age gate and download-option TypeScript diagnostics
        run: |
          npx tsc --noEmit > ui-ts-diagnostics.txt 2>&1 || true
          if grep -E '^(app/components/ads/StaticPageAdPair|app/components/ui/ContactUs|app/components/feed/VideoOptionsModal|app/components/age/AdultAgeGate)\.tsx.*error TS' ui-ts-diagnostics.txt; then
            exit 1
          fi
      - name: Check History and Watch CTA TypeScript diagnostics
        run: |
          npx tsc --noEmit > history-ts-diagnostics.txt 2>&1 || true
          if grep -E '^(app/history/|lib/actions/history\\.ts|app/components/feed/(PostCard|VideoCard|WatchVideoCard|layout/AppNavigation)\\.tsx|app/(liked|saved)/page\\.tsx).*error TS' history-ts-diagnostics.txt; then
            exit 1
          fi
      - name: Check downloader TypeScript diagnostics
        run: |
          npx tsc --noEmit > downloader-ts-diagnostics.txt 2>&1 || true
          if grep -E '^(app/download/|app/api/external-download/|lib/external-download\.ts).*error TS' downloader-ts-diagnostics.txt; then
            exit 1
          fi
      - name: Validate Python downloader syntax
        run: python3 -m py_compile services/video-downloader/app.py
      - name: Production build
        run: npm run build
